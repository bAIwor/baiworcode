name: Publish npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish baiworcode to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak cocok dengan versi package v${PKG_VERSION}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Determine npm dist-tag
        id: dist
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$PKG_VERSION" in
            *-alpha*) echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta*)  echo "tag=beta"  >> "$GITHUB_OUTPUT" ;;
            *-rc*)    echo "tag=rc"    >> "$GITHUB_OUTPUT" ;;
            *)        echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "### Publish diagnostics"
            echo "- npm registry: $(npm config get registry)"
            echo "- NODE_AUTH_TOKEN terisi: $([ -n "$NODE_AUTH_TOKEN" ] && echo ya || echo TIDAK)"
            echo "- npm whoami: $(npm whoami 2>&1 | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
          npm publish --provenance --access public --tag ${{ steps.dist.outputs.tag }} 2>&1 | tee /tmp/publish.txt || {
            echo "### ❌ npm publish gagal" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 /tmp/publish.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
