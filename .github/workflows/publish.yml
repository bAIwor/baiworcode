name: Publish npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Diperlukan untuk npm Trusted Publishing (OIDC) bila token tidak dipakai.
  id-token: write

jobs:
  publish:
    name: Publish baiworcode to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 → npm 11.5+ yang mendukung OIDC trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak cocok dengan versi package v${PKG_VERSION}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test

      - name: Determine npm dist-tag
        id: dist
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$PKG_VERSION" in
            *-alpha*) echo "tag=alpha" >> "$GITHUB_OUTPUT" ;;
            *-beta*)  echo "tag=beta"  >> "$GITHUB_OUTPUT" ;;
            *-rc*)    echo "tag=rc"    >> "$GITHUB_OUTPUT" ;;
            *)        echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          # .npmrc hanya ditulis bila secret token tersedia. Kalau tidak ada,
          # npm 11 memakai OIDC trusted publishing (butuh konfigurasi di
          # npmjs.com). Tanpa keduanya, npm akan melaporkan ENEEDAUTH.
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          fi
          {
            echo "### Publish diagnostics"
            echo "- node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- token secret: $([ -n "$NODE_AUTH_TOKEN" ] && echo 'ada' || echo 'tidak ada, mengandalkan OIDC trusted publishing')"
            echo "- panjang token: ${#NODE_AUTH_TOKEN}"
            echo "- akhiran token: ...${NODE_AUTH_TOKEN: -4}"
            echo "- mengandung '...' (masked?): $(case "$NODE_AUTH_TOKEN" in *...*) echo ya;; *) echo tidak;; esac)"
            echo "- .npmrc: $(cat "$HOME/.npmrc" 2>/dev/null | sed 's/_authToken=.*/_authToken=****/' | head -2)"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "::error title=token diagnostics::panjang=${#NODE_AUTH_TOKEN} masked=$(case "$NODE_AUTH_TOKEN" in *...*) echo ya;; *) echo tidak;; esac) akhir=...${NODE_AUTH_TOKEN: -4} npmrc=$(test -f "$HOME/.npmrc" && echo ada || echo tidak)"
          }
          npm publish --provenance --access public --tag ${{ steps.dist.outputs.tag }} 2>&1 | tee /tmp/publish.txt || {
            echo "### ❌ npm publish gagal" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 /tmp/publish.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Annotation (terbaca lewat API tanpa perlu hak admin) + ringkas
            # di summary. Token disamarkan agar tidak ikut tersebar.
            echo "::error title=npm publish gagal::$(grep -E '^npm (error|ERR!)|E[A-Z0-9]{4,}' /tmp/publish.txt | sed 's/npm_[A-Za-z0-9]*/npm_****/g' | head -12 | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          }
          # Verifikasi langsung ke registry, bukan hanya percaya exit code npm.
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          TERDAFTAR=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || echo "TIDAK-ADA")
          echo "::notice title=npm publish::terdaftar=$TERDAFTAR diminta=$PKG_VERSION"

      - name: Arahkan dist-tag latest ke rilis ini
        # Selama belum ada rilis stabil, `npm install @baiworcode/baiworcode`
        # (tanpa tag) harus memasang beta terbaru, bukan beta pertama yang tertinggal.
        if: ${{ steps.dist.outputs.tag != 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add "$PKG_NAME@$PKG_VERSION" latest
          echo "::notice title=dist-tag::latest -> $PKG_VERSION"
