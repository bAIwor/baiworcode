name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-local:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.txt || {
            echo "### ❌ Test gagal (Node ${{ matrix.node-version }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^not ok|^# (tests|pass|fail|skipped)" /tmp/test-output.txt | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>60 baris terakhir</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 /tmp/test-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Smoke test provider & config (mock server lokal)
        run: npm run audit:provider

  test-windows:
    name: Unit tests (Windows, Node 22)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  package-smoke:
    name: Package & dependency smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

  test-instabox:
    name: Full suite in InstaBox (Linux 4 vCPU / 8 GiB)
    runs-on: ubuntu-latest
    needs: test-local
    # Gate memakai repository variable (secrets tidak tersedia di if level job).
    # Aktifkan dengan: Settings → Variables → INSTABOX_ENABLED=true, lalu isi
    # secret INSTABOX_API_KEY. Hanya berjalan untuk push (bukan PR) agar kode
    # dari pull request tidak pernah menerima secret.
    if: ${{ vars.INSTABOX_ENABLED == 'true' && github.event_name != 'pull_request' }}
    env:
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
      REPO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REPO_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync & run tests in InstaBox
        run: |
          node scripts/instabox-sync.mjs --run \
            "rm -rf /data/home/work/ci && git clone --depth 1 https://github.com/${REPO_NAME}.git /data/home/work/ci && cd /data/home/work/ci && git fetch --depth 1 origin ${REPO_SHA} && git checkout ${REPO_SHA} && npm ci && npm test"
