name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-local:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-instabox:
    name: Full suite in InstaBox (Linux 4 vCPU / 8 GiB)
    runs-on: ubuntu-latest
    needs: test-local
    # Job ini hanya jalan bila secret INSTABOX_API_KEY diisi di repo settings.
    # Tanpa secret, job ini di-skip (bukan gagal) — aman untuk fork/PR eksternal.
    if: ${{ secrets.INSTABOX_API_KEY != '' }}
    env:
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
      REPO_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REPO_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync & run tests in InstaBox
        run: |
          node scripts/instabox-sync.mjs --run \
            "rm -rf /data/home/work/ci && git clone --depth 1 https://github.com/${REPO_NAME}.git /data/home/work/ci && cd /data/home/work/ci && git fetch --depth 1 origin ${REPO_SHA} && git checkout ${REPO_SHA} && npm ci && npm test"
